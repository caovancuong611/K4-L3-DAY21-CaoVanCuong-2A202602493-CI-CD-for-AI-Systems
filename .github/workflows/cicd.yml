name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      previous_f1: ${{ steps.previous.outputs.f1 }}
      candidate_key: ${{ steps.candidate.outputs.key }}
      candidate_report_key: ${{ steps.candidate.outputs.report_key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug OIDC claims (temporary)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const arn = '${{ secrets.AWS_ROLE_ARN }}';
            core.warning(`OIDC sub=${claims.sub} | aud=${claims.aud} | iss=${claims.iss} | role_arn_len=${arn.length} | role_arn_tail=${arn.slice(-30)} | region=${{ vars.AWS_REGION }}`);

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure DVC remote and pull training data
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          dvc remote add --force --default labstore "s3://${ARTIFACT_BUCKET}/dvc"
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"

      - name: Show precision / recall report
        run: cat outputs/detail.txt

      - name: Read F1 of the currently deployed model
        id: previous
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          if aws s3 cp "s3://${ARTIFACT_BUCKET}/artifacts/current/report.json" \
            "$RUNNER_TEMP/previous_report.json" --only-show-errors; then
            PREV_F1=$(python -c "import json, sys; print(json.load(open(sys.argv[1]))['f1_score'])" \
              "$RUNNER_TEMP/previous_report.json")
            echo "Deployed model f1_score: $PREV_F1"
            echo "f1=$PREV_F1" >> "$GITHUB_OUTPUT"
          else
            echo "No deployed report found; this is the first release."
          fi

      - name: Upload candidate model to S3
        id: candidate
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          PREFIX="artifacts/candidates/${GITHUB_SHA}"
          aws s3 cp models/model.joblib "s3://${ARTIFACT_BUCKET}/${PREFIX}/model.joblib"
          aws s3 cp outputs/report.json "s3://${ARTIFACT_BUCKET}/${PREFIX}/report.json"
          echo "key=${PREFIX}/model.joblib" >> "$GITHUB_OUTPUT"
          echo "report_key=${PREFIX}/report.json" >> "$GITHUB_OUTPUT"

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check F1 quality threshold
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import os

          f1 = float(os.environ["F1_SCORE"])
          if f1 < 0.65:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} < 0.65. Deployment is blocked."
              )
          print(f"PASSED: f1_score {f1:.4f} >= 0.65.")
          PY

      - name: Compare with the currently deployed model
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
          PREVIOUS_F1: ${{ needs.train.outputs.previous_f1 }}
          BLOCK_ON_F1_REGRESSION: ${{ vars.BLOCK_ON_F1_REGRESSION }}
        run: |
          python - <<'PY'
          import os

          new_f1 = float(os.environ["F1_SCORE"])
          previous = os.environ.get("PREVIOUS_F1", "")
          if not previous:
              print(f"No deployed model to compare with. New f1_score: {new_f1:.4f}.")
              raise SystemExit(0)

          previous_f1 = float(previous)
          print(
              f"New f1_score: {new_f1:.4f} | Deployed f1_score: {previous_f1:.4f} "
              f"| Delta: {new_f1 - previous_f1:+.4f}"
          )
          if new_f1 >= previous_f1:
              print("PASSED: new model is not worse than the deployed model.")
          elif os.environ.get("BLOCK_ON_F1_REGRESSION") == "true":
              raise SystemExit(
                  "FAILED: new model is worse than the deployed model. "
                  "Deployment is blocked; the current model keeps serving."
              )
          else:
              print(
                  "::warning::New model has a lower f1_score than the deployed model. "
                  "Set repository variable BLOCK_ON_F1_REGRESSION=true to block this release."
              )
          PY

  release:
    name: Release
    needs: [train, quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Temporarily allow this runner to SSH
        id: ssh_ingress
        env:
          SERVER_SECURITY_GROUP: ${{ secrets.SERVER_SECURITY_GROUP }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import os

          with urllib.request.urlopen("https://checkip.amazonaws.com", timeout=10) as response:
              runner_ip = response.read().decode().strip()
          permissions = [{
              "IpProtocol": "tcp",
              "FromPort": 22,
              "ToPort": 22,
              "IpRanges": [{
                  "CidrIp": f"{runner_ip}/32",
                  "Description": "Temporary GitHub Actions deploy access",
              }],
          }]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ssh-ingress.json"), "w") as file:
              json.dump(permissions, file)
          PY
          RULE_ID=$(aws ec2 authorize-security-group-ingress \
            --group-id "$SERVER_SECURITY_GROUP" \
            --ip-permissions "file://$RUNNER_TEMP/ssh-ingress.json" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)
          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"

      - name: Copy API code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src/serve.py,src/__init__.py"
          target: "/home/${{ secrets.SERVER_USER }}/income-api"
          strip_components: 0

      - name: Promote approved model to current
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          CANDIDATE_KEY: ${{ needs.train.outputs.candidate_key }}
          CANDIDATE_REPORT_KEY: ${{ needs.train.outputs.candidate_report_key }}
        run: |
          aws s3 cp \
            "s3://${ARTIFACT_BUCKET}/${CANDIDATE_KEY}" \
            "s3://${ARTIFACT_BUCKET}/artifacts/current/model.joblib"
          aws s3 cp \
            "s3://${ARTIFACT_BUCKET}/${CANDIDATE_REPORT_KEY}" \
            "s3://${ARTIFACT_BUCKET}/artifacts/current/report.json"

      - name: Restart service and verify health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            sudo systemctl restart income-api
            for attempt in $(seq 1 12); do
              if curl --fail --silent http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              sleep 5
            done
            sudo journalctl -u income-api -n 50 --no-pager
            echo "Health check failed after 60 seconds." >&2
            exit 1

      - name: Remove temporary runner SSH access
        if: always() && steps.ssh_ingress.outputs.rule_id != ''
        env:
          SERVER_SECURITY_GROUP: ${{ secrets.SERVER_SECURITY_GROUP }}
          SSH_INGRESS_RULE_ID: ${{ steps.ssh_ingress.outputs.rule_id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SERVER_SECURITY_GROUP" \
            --security-group-rule-ids "$SSH_INGRESS_RULE_ID"
